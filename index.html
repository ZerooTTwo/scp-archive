<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="SCP Archive：一个离线优先的 SCP 基金会文档阅读器。" />
    <meta name="theme-color" content="#efe9dd" id="theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SCP Archive" />
    <title>SCP Archive · 基金会档案</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Paint the correct theme and clearance before React boots
      // (settings are mirrored to localStorage).
      try {
        var stored = localStorage.getItem('scp-theme');
        var resolved =
          !stored || stored === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : stored;
        document.documentElement.dataset.theme = resolved;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
      try {
        var clearance = localStorage.getItem('scp-clearance');
        var allowed = ['o5', 'l4', 'l3', 'l2', 'l1', 'd'];
        document.documentElement.dataset.clearance =
          allowed.indexOf(clearance) >= 0 ? clearance : 'o5';
      } catch (error) {
        document.documentElement.dataset.clearance = 'o5';
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #141110;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: #141110;
        color: #efe6dc;
        font-family: ui-monospace, 'SF Mono', Consolas, monospace;
      }
      .boot-mark {
        display: block;
        width: 74px;
        height: 74px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .boot-text {
        font-size: 10px;
        letter-spacing: 0.34em;
        color: #9c8e82;
      }
      .boot-bar {
        width: 128px;
        height: 2px;
        overflow: hidden;
        background: #332c27;
      }
      .boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #d06555;
        animation: boot-slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-30%);
        }
        to {
          transform: translateX(190%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <img class="boot-mark" src="/icons/icon-192.png" alt="" width="74" height="74" />
        <script>
          try {
            var mark = localStorage.getItem('scp-app-icon');
            if (mark === 'cn' || mark === 'official') {
              document.querySelector('.boot-mark').src = '/icons/' + mark + '/icon-192.png';
            }
          } catch (error) {
            /* Theme preference is optional. */
          }
        </script>
        <div class="boot-text">SCP 基金会 · 档案库</div>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
